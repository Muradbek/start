<div class="cards__menu">
    <button class="add__user" (click)="editCreateUser()">Add User</button>

    <div class="cards">
        <app-user-card
            *ngFor="let user of UsersService.users"
            [user]="user"
            (delete)="deleteUser ($event)"
            (editUser)="editCreateUser (user)"
        ></app-user-card>
    </div>
</div>
