<mat-card class="example-card" appearance="outlined">
  <mat-card-header>
    <mat-card-title>{{ user?.name }}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p>
      {{ user?.email }}
    </p>
    <p>
      {{ user?.phone }}
    </p>
    <p>
      {{ user?.website }}
    </p>
  </mat-card-content>
  <mat-card-footer class="example-card-footer">
    <mat-chip-set style="padding-left: 5px" aria-label="Chihuahua traits">
      <mat-chip (click)="deleteUser(user?.id)">Delete</mat-chip>
      <mat-chip (click)="updateUser()">Update</mat-chip>
    </mat-chip-set>
  </mat-card-footer>
</mat-card>
